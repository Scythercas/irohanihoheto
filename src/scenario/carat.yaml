# =============================================================================
# カラット導入 ― プロフィール作成から、桃果とのマッチング・初トークまで
#
# 【追加された書き方】
#   screen: chat / with: momoka … このシーンをチャット画面で表示する
#   from: momoka / msg: "..."   … チャットの1メッセージ（from が iroha なら自分）
#   reply: [...]                … 返信を選ぶ。選んだ文が自分の吹き出しとして残る
#   carat: match / profile      … カラットのカードを出す（target にヒロインID）
#   schedule: true              … 週スケジュール画面に制御を渡す
#
# 【桃果の攻略軸＝自信】決めてあげること。「どこでもいいよ」は減点（設計書 §2.2）
# =============================================================================

- id: carat_setup
  bg: room_night
  bgm: bgm_app
  next: carat_swipe
  body:
    - text: "プロフィール写真。趣味。自己紹介文。"
    - text: "空欄を埋めていくうちに、自分という人間がいかに説明しづらいかを思い知った。"

    - text: "『休日は何をしていますか？』"
    - text: "（……寝てる、とは書けないよな）"

    - text: "十五分かけて、当たり障りのない三行を書いた。"
    - text: "登録完了。"

- id: carat_swipe
  next: carat_match_momoka
  body:
    - se: se_swipe
    - text: "画面に、知らない誰かの顔が次々と流れてくる。"
    - text: "右にスワイプすれば「いいね」。左に流せば、その人とは二度と会わない。"

    - text: "（軽い。軽すぎる）"
    - text: "（でも、この軽さがなければ、俺は一生誰とも出会わないんだろうな）"

    - text: "三日が過ぎた。"
    - text: "いいねを二十件送って、今のところ返ってきたのは一件だった。"

- id: carat_match_momoka
  next: chat_momoka_01
  body:
    - se: se_notification
    - carat: match
      target: momoka

    - flag: met_momoka
      value: true

    - text: "桃果、二十一歳。大学三年生。"
    - text: "（……年下だ）"
    - text: "（というか、学生だ）"

    - carat: profile
      target: momoka

    - text: "『いろいろ連れて行ってくれる人だとうれしいなあ』"
    - text: "（連れて行く。俺が？）"

    - text: "画面の下で、メッセージの入力欄が点滅していた。"

# --- ここからチャット画面 -----------------------------------------------------

- id: chat_momoka_01
  screen: chat
  with: momoka
  next: chat_momoka_02
  body:
    - from: momoka
      msg: "はじめまして〜！マッチありがとうございます！"
    - from: momoka
      msg: "いろはさんって、お名前めずらしいですね"

    - reply:
        - text: "こちらこそ。よろしくお願いします"
          params: { confidence: 1 }
        - text: "よく言われる。色の葉っぱで、色葉"
          params: { confidence: 2 }
          affection: { momoka: 1 }
        - text: "え、ほんとに俺なんかでいいの？"
          params: { confidence: -3 }

    - from: momoka
      msg: "いろは……いろは。かわいい名前！"
    - from: momoka
      msg: "わたし、社会人の方とお話するのはじめてです"
    - from: momoka
      msg: "緊張しちゃうなあ"

- id: chat_momoka_02
  screen: chat
  with: momoka
  next: chat_momoka_03
  body:
    - from: momoka
      msg: "あの、もしよかったらなんですけど"
    - from: momoka
      msg: "今度どこか、連れて行ってもらえたりしますか？？"

    - text: "（連れて行く、か）"

    - reply:
        - text: "いいよ。どこ行きたい？"
          params: { confidence: -3 }
          goto: chat_momoka_02b_weak
        - text: "日曜、水族館はどう。夕方から空いてる"
          params: { confidence: 4 }
          affection: { momoka: 2 }
          goto: chat_momoka_02b_lead
        - text: "考えとく"
          params: { confidence: -1 }
          goto: chat_momoka_02b_weak

- id: chat_momoka_02b_weak
  screen: chat
  with: momoka
  next: chat_momoka_03
  body:
    - from: momoka
      msg: "えっと……"
    - from: momoka
      msg: "うーん、どこがいいかな〜"
    - from: momoka
      msg: "いろはさんの行きたいところで大丈夫です！"

    - text: "（……会話が止まった）"
    - text: "（この子は、たぶん、決めてほしいんだ）"

- id: chat_momoka_02b_lead
  screen: chat
  with: momoka
  next: chat_momoka_03
  body:
    - from: momoka
      msg: "水族館！！"
    - from: momoka
      msg: "行きたいです、行きたい"
    - from: momoka
      msg: "夕方って、なんかいいですね。ずるい"

    - text: "（ずるい、とは）"
    - text: "（でも、悪くない反応だった）"

- id: chat_momoka_03
  screen: chat
  with: momoka
  # 桃果のあと、同じ週のうちに残り4人とも繋がる（encounters.yaml）
  next: carat_more_01
  body:
    - from: momoka
      msg: "じゃあ、また連絡しますね！"
    - from: momoka
      msg: "おやすみなさい〜"

    - text: "スマホを置いて、天井を見た。"
    - text: "誰かと予定を決めるという行為を、久しぶりにした気がした。"

# --- 週スケジュール ----------------------------------------------------------

- id: schedule_hub
  bg: room_night
  body:
    - schedule: true

- id: momoka_date_01
  bg: aquarium_evening
  bgm: bgm_date
  next: schedule_hub
  body:
    # デート1回につき、対応する色が基礎値ぶん伸びる（点数設計は docs/05 §6）
    - params: { confidence: 6 }

    # 行き先は、トークで水族館を提案していてもいなくても成立する書き方にする。
    # （提案しなかった分岐では「決めてほしい」と預けられて終わっているため）
    - text: "結局、行き先はこちらで決めることになった。"
    - text: "水族館は、平日の夕方でも人がいた。"
    - text: "青い光の中を、桃果が小走りで進んでいく。"

    - who: momoka
      face: smile
      text: "「いろはさん、こっち！　クラゲ！」"

    - text: "（元気だな）"

    - who: momoka
      face: smile
      text: "「わたし、クラゲって意味わかんなくて好きなんです。何も考えてなさそうで」"

    - who: iroha
      text: "「褒めてるのかそれ」"

    - who: momoka
      face: laugh
      text: "「褒めてます！」"

    - text: "順路の終わりに、小さなカフェがあった。"

    - bg: cafe_evening

    - who: momoka
      face: normal
      text: "「あ……どうします？」"

    - text: "（また、こっちに預けてきた）"

    - choice:
        - text: "座ろう。二階の席が空いてる"
          params: { confidence: 6 }
          affection: { momoka: 3 }
          goto: momoka_date_01_lead
        - text: "桃果はどうしたい？"
          params: { confidence: -2 }
          goto: momoka_date_01_weak

- id: momoka_date_01_lead
  next: schedule_hub
  body:
    - who: momoka
      face: smile
      text: "「……はい」"

    - text: "桃果は少し驚いた顔をして、それから、嬉しそうに笑った。"

    - who: momoka
      face: smile
      text: "「そういうの、いいですね」"

    - who: iroha
      text: "「そういうのって」"

    - who: momoka
      face: away
      text: "「なんでもないでーす」"

    - text: "（……悪くない）"

- id: momoka_date_01_weak
  next: schedule_hub
  body:
    - who: momoka
      face: normal
      text: "「わたしは、いろはさんが決めてくれたら……」"

    - text: "言いかけて、桃果は口をつぐんだ。"
    - text: "少しだけ、笑顔が薄くなった気がした。"

    - who: momoka
      face: normal
      text: "「じゃあ、帰りましょっか」"

    - text: "（何か、間違えた）"

# --- 茜への相談（C3: ヒント役） -----------------------------------------------

# 茜への相談は3部構成になっている。
#
#   akane_talk_01     … 導入（誰の話をするかはまだ決まっていない）
#   akane_hint_select … **誰について相談するかをプレイヤーが選ぶ**
#   akane_hint_<ID>   … その子に対する具体的な助言（C3: 茜がヒント役）
#   akane_talk_close  … 締め。ここでデレ段階のゲートを通す
#
# 【なぜ相手を選ばせるのか】
# 以前は「その子、年下でしょ」と桃果を決め打ちしていた。
# 5人と並行して会う設計になった時点で、**誰の話かは茜には分からない**はずであり、
# 実際に葵と会った直後でも桃果の話をされるという矛盾が起きていた。
# プレイヤーに選ばせることで矛盾が消え、C3のヒント機能もようやく実際に働くようになる。
#
# 【重要】茜が主人公に揺れる描写は、
#   ①ヒロインと2人以上出会っている ②総合魅力レベルが AKANE_DERE_STEPS[0] に到達している
# の両方を満たすまで出さない。序盤の茜はあくまで口の悪い幼馴染。
- id: akane_talk_01
  bg: family_restaurant
  bgm: bgm_daily
  next: akane_hint_select
  body:
    # 茜は「総合」の担当。相談すると5色すべてが少しずつ伸びる。
    # 行動枠を1つ使う以上、何も起きないと相談する動機がなくなってしまうため。
    - params: { sincerity: 1, tolerance: 1, humor: 1, sensibility: 1, confidence: 1 }

    - text: "深夜のファミレス。茜はドリンクバーだけで三時間粘る女だった。"

    - who: akane
      face: bored
      text: "「で？　うまくいってないんでしょ、顔に出てる」"

    - who: iroha
      text: "「……なんでわかるんだよ」"

    - who: akane
      face: smug
      text: "「二十四年」"

    - text: "それだけ言って、茜はストローを咥えた。"

    - who: akane
      face: bored
      text: "「言っとくけど、私は恋愛の専門家じゃないからね」"

    - who: akane
      face: normal
      text: "「ただ、女がなに考えてるかは、あんたよりは知ってる」"

- id: akane_hint_select
  body:
    - who: akane
      face: normal
      text: "「で、誰の話。名前で言って」"

    - choice:
        - text: "葵さん。年上の、看護師の人"
          requireFlag: met_aoi
          goto: akane_hint_aoi
        - text: "翠さん。花屋で働いてる人"
          requireFlag: met_sui
          goto: akane_hint_sui
        - text: "橙香さん。とにかくよく喋る子"
          requireFlag: met_touka
          goto: akane_hint_touka
        - text: "紫音さん。デザイナーの人"
          requireFlag: met_shion
          goto: akane_hint_shion
        - text: "桃果って子。年下の大学生"
          requireFlag: met_momoka
          goto: akane_hint_momoka
        - text: "特にない。近況を話しに来ただけ"
          goto: akane_hint_none

# 各ヒントは heroines.ts の hint と同じ内容を、茜の口調で言わせている。
# ここがずれるとプロフィール画面の説明と食い違うので、直すときは両方を直すこと。

- id: akane_hint_aoi
  next: akane_talk_close
  body:
    - who: akane
      face: bored
      text: "「その人、取り繕われるのが一番きらいなタイプでしょ」"

    - who: iroha
      text: "「会ったこともないのに」"

    - who: akane
      face: smug
      text: "「そういう人は、だいたい自分が嘘をつけないから」"

    - who: akane
      face: normal
      text: "「間違ってると思ったら、ちゃんと言ってあげな。合わせるのがいちばん失礼」"

    - who: akane
      face: bored
      text: "「ただし人前ではやめときな。それは訂正じゃなくて、晒しだから」"

    - text: "（……後半のほうが、たぶん重要だ）"

- id: akane_hint_sui
  next: akane_talk_close
  body:
    - who: akane
      face: normal
      text: "「落ち込んでるときに励ますのは、逆効果」"

    - who: akane
      face: normal
      text: "「『頑張って』は、まだ足りないって意味に聞こえるから」"

    - who: iroha
      text: "「じゃあ、なんて言えば」"

    - who: akane
      face: bored
      text: "「なんも言わなくていいの。黙って聞いてあげな」"

    - who: akane
      face: away
      text: "「……あんた、それ苦手でしょ。すぐ解決しようとするから」"

    - text: "（二十四年ぶんの指摘は、いちいち痛い）"

- id: akane_hint_touka
  next: akane_talk_close
  body:
    - who: akane
      face: laugh
      text: "「あー、ボケ倒してくるタイプね」"

    - who: akane
      face: bored
      text: "「真面目に返したら終わり。ちゃんと拾ってあげな」"

    - who: akane
      face: normal
      text: "「ただし、自分を下げるボケだけは拾っちゃだめ」"

    - who: iroha
      text: "「なんで」"

    - who: akane
      face: normal
      text: "「乗っかった瞬間、冗談じゃなくなるから」"

    - text: "（……覚えておこう）"

- id: akane_hint_shion
  next: akane_talk_close
  body:
    - who: akane
      face: bored
      text: "「『なんかいいね』は絶対に言うな」"

    - who: akane
      face: bored
      text: "「あれ、なんにも見てませんって宣言してるのと同じだから」"

    - who: iroha
      text: "「わからないときは」"

    - who: akane
      face: normal
      text: "「わからないって言いな。そっちのほうが、まだマシ」"

    - who: akane
      face: smug
      text: "「知ったかぶりは、わかる人には一秒でばれる」"

- id: akane_hint_momoka
  next: akane_talk_close
  body:
    - who: akane
      face: bored
      text: "「『どこでもいいよ』は言うな」"

    - who: akane
      face: bored
      text: "「あの子はあんたに決めてほしいの」"

    - who: iroha
      text: "「決めて、外したら」"

    - who: akane
      face: normal
      text: "「外していいの。外したあとに『次はここ』って言えるかどうかだから」"

    - who: akane
      face: away
      text: "「……あと、年下相手に説教はすんなよ。それは自信じゃなくて、ただの威圧」"

- id: akane_hint_none
  next: akane_talk_close
  body:
    - who: iroha
      text: "「いや、特には」"

    - who: akane
      face: bored
      text: "「……は？　じゃあなんで呼んだの」"

    - who: iroha
      text: "「なんとなく」"

    - who: akane
      face: bored
      text: "「出た」"

    - text: "文句を言いながら、茜はドリンクバーをもう一杯取りに行った。"
    - text: "（……付き合ってくれるんだよな、結局）"

# 締め。ここでデレ段階のゲートを通す。
- id: akane_talk_close
  body:
    # AKANE_DERE_STEPS = [60, 110, 160, 210]。上から順に評価されるので、
    # **しきい値の高いものを先に**書く。順序を逆にすると永久に第1段階しか出ない。
    - branch:
        - goto: akane_dere_04
          ifMetCount: 2
          ifTotalParam: 210
        - goto: akane_dere_03
          ifMetCount: 2
          ifTotalParam: 160
        - goto: akane_dere_02
          ifMetCount: 2
          ifTotalParam: 110
        - goto: akane_dere_01
          ifMetCount: 2
          ifTotalParam: 60
        - goto: akane_talk_plain

- id: akane_talk_plain
  next: schedule_hub
  body:
    # 「特にない」を選んだ場合にもつながるよう、相談内容に触れない締めにしてある。
    - who: akane
      face: bored
      text: "「……ま、せいぜい頑張れば」"

    - text: "気づけば、二時間が経っていた。"
    - text: "伝票を持って、茜は先に立ち上がった。"

    - who: akane
      face: smug
      text: "「言っとくけど、割り勘だから」"

    - text: "（相変わらず、容赦がない）"

# --- ここから先はデレ段階に到達してから解放される（H5） -----------------------

- id: akane_dere_01
  bg: family_restaurant
  bgm: bgm_daily
  next: schedule_hub
  body:
    - text: "話が一段落したところで、茜がこちらを見た。少しだけ、間があった。"

    - who: akane
      face: normal
      text: "「あんた、変わったね」"

    - who: iroha
      text: "「そうか？」"

    - who: akane
      face: fluster
      text: "「……なんでもない。忘れて」"

    - text: "茜はストローを咥えて、窓の外を見た。"
    - text: "（……耳が赤い）"
    - text: "（気のせいだと思うことにした）"

- id: akane_dere_02
  bg: family_restaurant
  bgm: bgm_daily
  next: schedule_hub
  body:
    - text: "こちらが席を立とうとしたら、袖を引かれた。"

    - who: akane
      face: normal
      text: "「……あのさ」"

    - who: akane
      face: normal
      text: "「私も最近、ちょっとだけ、焦ることがある」"

    - who: iroha
      text: "「茜が？」"

    - who: akane
      face: fluster
      text: "「なんでもない。座り直さないで。帰って」"

    - text: "（何かを言いかけて、やめた）"
    - text: "（二十四年で、初めて見る顔だった）"

- id: akane_dere_03
  bg: family_restaurant
  bgm: bgm_daily
  next: schedule_hub
  body:
    - text: "帰り支度をしていて、はじめて気づいた。"
    - text: "その夜の茜は、髪をほどいていた。"
    - text: "低い位置で結んでいるのを、二十四年見てきた。"

    - who: iroha
      text: "「……珍しいな」"

    - who: akane
      face: away
      text: "「ゴム切れただけ」"

    - text: "嘘だと思ったが、言わなかった。"

    - who: akane
      face: normal
      text: "「あんた、最近ちゃんとしてるね。話し方とか」"

    - who: iroha
      text: "「そうか？」"

    - who: akane
      face: normal
      text: "「うん。……誰かのおかげなんだろうけど」"

    - text: "グラスの氷が鳴った。"

    - who: akane
      face: bored
      text: "「言っとくけど、褒めてないから。事実を言っただけ」"

    - text: "（それを人は、褒めていると言う）"
    - text: "（でも、指摘はしないでおいた）"

- id: akane_dere_04
  bg: family_restaurant
  bgm: bgm_daily
  next: schedule_hub
  body:
    - text: "ファミレスを出たのは、二時を回ったころだった。"

    - bg: street_evening

    - text: "夜の街は、店の看板がひとつずつ落ちていく時間だった。"

    - who: akane
      face: normal
      text: "「ねえ」"

    - who: akane
      face: normal
      text: "「あんたさ、最初に私に相談したじゃん。彼女欲しいって」"

    - who: iroha
      text: "「……言ったな」"

    - who: akane
      face: away
      text: "「あのとき、私、笑ったでしょ」"

    - text: "茜が立ち止まった。"

    - who: akane
      face: fluster
      text: "「あれ、笑うしかなかったんだよ」"

    - text: "（……え）"

    - who: akane
      face: bored
      text: "「はい、この話終わり。忘れて。忘れなかったら殴る」"

    - text: "茜は先に歩き出した。歩幅が、いつもより大きかった。"
    - text: "（――今のは）"
    - text: "（今のは、たぶん、聞いてはいけなかった）"

- id: date_filler
  bg: street_evening
  next: schedule_hub
  body:
    - text: "その日は、とくに何も起こらなかった。"
    - text: "予定を埋めるだけの一日というのも、たまにはある。"
