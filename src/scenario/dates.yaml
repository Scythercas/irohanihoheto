# =============================================================================
# デート ― 葵・翠・橙香・紫音（桃果は carat.yaml）
#
# 【点数設計】docs/05_implementation-status.md §6 が正。
#   ・書き下ろしのデート … 冒頭で対応色 +6、選択肢の正解で +6（最良 +12／最悪 +4）
#   ・重ねの一日（_extra）… 対応色 +8 固定。選択肢なし
#   ・茜への相談        … 5色すべて +1（carat.yaml）
#     └ 茜の相談を厚くしすぎると「誰にも会わず茜だけに相談する」で茜ルートに入れてしまい、
#       「5人と出会って色を得る」という作品の骨格（CLAUDE.md §3.3）が崩れる。
#   この配分を崩すとエンディングの到達可能性が変わる。`npm run balance` で検証できる。
#
# 【選択肢の正解】設計書 §2.2 の「攻略の軸」と「地雷」に必ず対応させること。
#   ここがぶれると、茜のヒント（heroines.ts の hint）が嘘になる。
# =============================================================================

# --- 葵（青／誠実さ）---------------------------------------------------------
# 軸: 約束を守る／天然を正直に訂正する／盛らない
# 地雷: ドタキャン、話を合わせるだけの相槌、天然を馬鹿にして笑う

- id: aoi_date_01
  bg: cafe_day
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { sincerity: 6 }

    - text: "待ち合わせは十一時だった。"
    - text: "葵から「二時間遅れます」と連絡が来たのは、十時五十分だった。"

    - text: "（……緊急入院、と書いてある）"
    - text: "（怒る理由が、ひとつもない）"

    - text: "喫茶店で二時間待った。文庫本が半分読めた。"

    - who: aoi
      face: normal
      text: "「……ほんとに、ごめんなさい」"

    - text: "現れた葵は、髪をひとつに縛ったままだった。"
    - text: "化粧を直す時間もなかったのだろう。"

    - who: aoi
      face: normal
      text: "「たぶん、嫌になりましたよね。初回からこれで」"

    - who: iroha
      text: "「いや。二時間で済んでよかったなと思ってた」"

    - who: aoi
      face: smile
      text: "「……変な人」"

    - text: "コーヒーを二杯飲むころには、葵はよく喋るようになっていた。"
    - text: "職場の後輩の話。夜勤明けの飯がいちばんうまいという話。"

    - who: aoi
      face: normal
      text: "「そういえば、色葉さんって年収どのくらいなんですか」"

    - text: "（……直球だ）"
    - text: "（この人は、たぶん、探りを入れているんじゃない）"

    - choice:
        - text: "そんなに多くない。同年代の平均くらいだと思う"
          params: { sincerity: 6 }
          affection: { aoi: 3 }
          goto: aoi_date_01_true
        - text: "まあ、それなりには"
          params: { sincerity: -2 }
          goto: aoi_date_01_bluff

- id: aoi_date_01_true
  next: schedule_hub
  body:
    - who: aoi
      face: smile
      text: "「はい。じゃあ今日は割り勘で」"

    - who: iroha
      text: "「早いな」"

    - who: aoi
      face: laugh
      text: "「わたし、見栄を張られるのがいちばん困るんです」"

    - who: aoi
      face: normal
      text: "「あとで必ずばれるので。そのとき、嘘をつかれたことのほうが痛い」"

    - text: "（……なるほど）"
    - text: "（この人の前では、盛るという選択肢が最初から無効なのか）"

    - who: aoi
      face: smile
      text: "「また、待たせるかもしれませんけど」"

    - who: iroha
      text: "「本、持ってくる」"

    - who: aoi
      face: laugh
      text: "「用意がいい」"

- id: aoi_date_01_bluff
  next: schedule_hub
  body:
    - who: aoi
      face: normal
      text: "「……それなり」"

    - text: "葵はそれ以上聞かなかった。"
    - text: "聞かなかった、というより、興味を引っ込めた感じだった。"

    - who: aoi
      face: normal
      text: "「わたし、患者さんの嘘はすぐわかるんですよ。痛くないって言う人ほど痛い」"

    - who: aoi
      face: normal
      text: "「職業病ですね。すみません」"

    - text: "（……刺された）"
    - text: "（たぶん、刺したつもりもないんだろうな）"

- id: aoi_date_02
  bg: cafe_day
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { sincerity: 6 }

    - text: "病院の近くの喫茶店で、葵の同僚に鉢合わせした。"
    - text: "後輩だという二人組は、葵を見つけると露骨に嬉しそうな顔をした。"

    - who: aoi
      face: normal
      text: "「……見なかったことにして」"

    - text: "無理だった。二人はそのまま隣の席に座った。"

    - who: aoi
      face: smile
      text: "「この人ね、この前わたしが夜勤明けで倒れかけたとき、"
    - who: aoi
      face: smile
      text: "　ちゃんと二時間待っててくれたの」"

    - text: "後輩たちが、こちらを見て笑った。悪意のない笑い方だった。"

    - who: aoi
      face: normal
      text: "「あ、そうだ。知ってる？　人間の体って、七割が骨なんだって」"

    - text: "（……七割は水分だ）"
    - text: "（後輩の前で、この人は今それを言った）"

    - choice:
        - text: "その場では流し、店を出てから二人きりで伝える"
          params: { sincerity: 6 }
          affection: { aoi: 3 }
          goto: aoi_date_02_later
        - text: "その場で正しく訂正する"
          params: { sincerity: -2 }
          goto: aoi_date_02_now

- id: aoi_date_02_later
  bg: street_evening
  next: schedule_hub
  body:
    - text: "店を出て、後輩たちと別れてから言った。"

    - who: iroha
      text: "「さっきの、七割は水分だと思う」"

    - who: aoi
      face: fluster
      text: "「……えっ」"

    - who: aoi
      face: fluster
      text: "「言ってよ、あの場で！」"

    - who: iroha
      text: "「あの場では言わないよ」"

    - text: "葵が立ち止まった。"

    - who: aoi
      face: normal
      text: "「……ああ」"

    - who: aoi
      face: smile
      text: "「間違いは直してほしいけど、恥はかきたくない。"
    - who: aoi
      face: smile
      text: "　わがままですよね、それ」"

    - who: iroha
      text: "「わがままじゃないと思う」"

    - text: "（正しさと、優しさは、別々に届けられる）"
    - text: "（それだけのことに、二十四年かかった）"

- id: aoi_date_02_now
  next: schedule_hub
  body:
    - who: iroha
      text: "「七割は水分ですよ」"

    - text: "後輩の一人が、こらえきれずに噴き出した。"

    - who: aoi
      face: away
      text: "「……そうだった。ごめん、わたしの記憶違い」"

    - text: "葵は笑ってみせた。うまい笑い方だった。"
    - text: "うますぎて、それが仕事用の顔だと分かってしまった。"

    - text: "（間違いは、直した）"
    - text: "（直す場所を、間違えた）"

- id: aoi_date_03
  bg: family_restaurant
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { sincerity: 6 }

    - text: "その日は、こちらの仕事が終わらなかった。"
    - text: "約束は二十時。時計は十九時十分を指している。"
    - text: "机の上には、どう見ても一時間では終わらない量が残っていた。"

    - text: "（……間に合わない）"
    - text: "（この人は、いつも遅れる側だ。一度くらい、遅れてもいいはずだ）"

    - choice:
        - text: "すぐ連絡して「一時間遅れる」と正確に伝える"
          params: { sincerity: 6 }
          affection: { aoi: 3 }
          goto: aoi_date_03_honest
        - text: "間に合うつもりで黙って向かう"
          params: { sincerity: -2 }
          goto: aoi_date_03_silent

- id: aoi_date_03_honest
  next: schedule_hub
  body:
    - text: "十九時十二分に、正確な見込みを送った。"
    - text: "返事はすぐ来た。『了解です。本読んでます』"

    - text: "二十一時。ファミレスの窓際で、葵は文庫本を開いていた。"

    - who: aoi
      face: normal
      text: "「これ、この前あなたが持ってた本と同じやつ」"

    - who: iroha
      text: "「……買ったのか」"

    - who: aoi
      face: smile
      text: "「待つ側の気持ち、初めて知りました」"

    - who: aoi
      face: normal
      text: "「わたし、いつも遅れる側だから。"
    - who: aoi
      face: normal
      text: "　早めに正確な時間を言われるのが、こんなに楽だとは思わなかった」"

    - text: "（謝るより、早く正確に言うほうが効く）"
    - text: "（この人が最初からやっていたことだった）"

- id: aoi_date_03_silent
  next: schedule_hub
  body:
    - text: "結局、着いたのは二十一時十分だった。"
    - text: "途中で三回、『あと少しで出ます』と送った。三回とも嘘になった。"

    - who: aoi
      face: normal
      text: "「おつかれさまです」"

    - text: "葵は怒っていなかった。まったく怒っていなかった。"

    - who: aoi
      face: normal
      text: "「一時間かかるって、最初に言ってくれたらよかったのに」"

    - who: aoi
      face: normal
      text: "「そしたらわたし、一回家に帰れたので」"

    - text: "（……そうか）"
    - text: "（遅れたことじゃない。見込みを偽ったことだ）"

- id: aoi_date_extra
  bg: cafe_day
  next: schedule_hub
  body:
    - params: { sincerity: 8 }

    - text: "葵とは、だいたい昼に会う。夜は仕事だからだ。"

    - who: aoi
      face: normal
      text: "「今日は三十分しかないんですけど、いいですか」"

    - who: iroha
      text: "「三十分あれば足りる」"

    - who: aoi
      face: smile
      text: "「なにが」"

    - text: "答えは持っていなかった。"
    - text: "ただ、三十分のために電車に乗ることを、面倒だと思わなくなっていた。"

# --- 翠（緑／包容力）---------------------------------------------------------
# 軸: 落ち込んだ日に受け止めて待つ／催促しない／知識マウントを取らない
# 地雷: 前向きな説教、「頑張って」、既読催促

- id: sui_date_01
  bg: cafe_evening
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { tolerance: 6 }

    - text: "翠は、約束の時間の十分前に来ていた。"
    - text: "そして、来ていたことを言わなかった。"

    - who: sui
      face: normal
      text: "「……あ。こんにちは」"

    - text: "声が小さい。店内の音楽に半分持っていかれる。"

    - who: sui
      face: normal
      text: "「今日は、だいじょうぶな日です」"

    - who: iroha
      text: "「だいじょうぶじゃない日もあるんだ」"

    - who: sui
      face: normal
      text: "「あります。……たくさん」"

    - text: "翠は紅茶を頼んで、二十分かけて半分飲んだ。"
    - text: "沈黙が、思っていたより苦しくなかった。"

    - who: sui
      face: normal
      text: "「わたし、こういうとき、何か話さなきゃって焦っちゃうんです」"

    - who: sui
      face: normal
      text: "「今も、焦ってます」"

    - text: "（……どうする）"

    - choice:
        - text: "何も言わずに、窓の外を見る"
          params: { tolerance: 6 }
          affection: { sui: 3 }
          goto: sui_date_01_quiet
        - text: "気にしなくていいですよ、と伝える"
          params: { tolerance: -2 }
          goto: sui_date_01_reassure

- id: sui_date_01_quiet
  next: schedule_hub
  body:
    - text: "何も言わなかった。"
    - text: "外では、店の前の街路樹が風に揺れていた。"

    - text: "五分ほどして、翠がぽつりと言った。"

    - who: sui
      face: normal
      text: "「……焦らなくても、よかったんですね」"

    - who: sui
      face: smile
      text: "「これ、はじめてです。黙ってても平気な人」"

    - text: "（何もしなかったことが、何かになった）"
    - text: "（そんなことが、あるのか）"

- id: sui_date_01_reassure
  next: schedule_hub
  body:
    - who: iroha
      text: "「気にしなくていいですよ」"

    - who: sui
      face: normal
      text: "「はい。……ありがとうございます」"

    - text: "翠は笑った。笑って、それきり黙った。"
    - text: "その沈黙は、さっきまでの沈黙とは種類が違った。"

    - text: "（気にするな、と言われて気にしなくなる人間はいない）"
    - text: "（知っていたのに、言ってしまった）"

- id: sui_date_02
  bg: street_evening
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { tolerance: 6 }

    - text: "翠からの返信が、三日途切れた。"
    - text: "既読はついていた。四日目の夜に、短い一言が来た。"
    - text: "『あした、店にいます』"

    - text: "花屋の前に着いたのは、閉店の三十分前だった。"

    - who: sui
      face: normal
      text: "「……こんばんは」"

    - text: "翠は、三日ぶんの説明をしなかった。"
    - text: "こちらが何か言うのを待っている顔でもなかった。ただ、そこにいた。"

    - text: "（……どうする）"

    - choice:
        - text: "何も聞かず、いつもどおり話す"
          params: { tolerance: 6 }
          affection: { sui: 3 }
          goto: sui_date_02_normal
        - text: "「心配したよ」と伝える"
          params: { tolerance: -2 }
          goto: sui_date_02_worry

- id: sui_date_02_normal
  next: schedule_hub
  body:
    - who: iroha
      text: "「今日、何の花が入ったの」"

    - text: "翠が、少しだけ目を上げた。"

    - who: sui
      face: normal
      text: "「……ラナンキュラス。まだ固いです」"

    - who: iroha
      text: "「固いのは、まだ売れないってこと？」"

    - who: sui
      face: normal
      text: "「いえ。固いほうが、長く咲きます」"

    - text: "それから三十分、花の話だけをした。"
    - text: "三日のことは、最後まで一度も出なかった。"

    - who: sui
      face: smile
      text: "「……戻ってきていいんだって、思えました」"

    - text: "（待つというのは、何もしないことじゃないらしい）"

- id: sui_date_02_worry
  next: schedule_hub
  body:
    - who: iroha
      text: "「心配したよ」"

    - who: sui
      face: normal
      text: "「……ごめんなさい」"

    - text: "翠は、そのあと何度も謝った。"
    - text: "こちらが謝らせるつもりで言ったのでないことは、たぶん伝わっていない。"

    - who: sui
      face: normal
      text: "「わたし、また同じことすると思います。そのときも、たぶん謝ります」"

    - text: "（心配した、は）"
    - text: "（この人には、請求書に聞こえるのか）"

- id: sui_date_03
  bg: cafe_day
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { tolerance: 6 }

    - text: "翠が、めずらしく自分から話し続けていた。"
    - text: "その日は「だいじょうぶな日」だったらしい。"

    - who: sui
      face: smile
      text: "「これ、アルストロメリアっていうんです。花びらに筋が入ってるでしょう」"

    - who: sui
      face: smile
      text: "「この筋、蜜のありかを虫に教えてる道しるべなんですよ」"

    - text: "（……知っている）"
    - text: "（前に調べた。ハニーガイドという名前まで覚えている）"

    - choice:
        - text: "「名前だけ知ってた。そんな意味があるんだ」と聞く側に回る"
          params: { tolerance: 6 }
          affection: { sui: 3 }
          goto: sui_date_03_listen
        - text: "「ハニーガイドっていうんだよね」と知識を足す"
          params: { tolerance: -2 }
          goto: sui_date_03_topping

- id: sui_date_03_listen
  next: schedule_hub
  body:
    - who: sui
      face: smile
      text: "「そうなんです！　案内板みたいで、かわいくないですか」"

    - text: "翠はそのあと、四種類ぶん同じ話をした。"
    - text: "一度も止めなかった。止める理由が見つからなかった。"

    - who: sui
      face: smile
      text: "「……わたし、こんなに喋ったの久しぶりです」"

    - who: sui
      face: normal
      text: "「聞いてくれる人の前だと、こうなるんですね。わたし」"

    - text: "（知っていることを言わないだけで、この人はこんなに喋る）"

- id: sui_date_03_topping
  next: schedule_hub
  body:
    - who: sui
      face: normal
      text: "「……あ。はい、そうです」"

    - text: "翠は少し笑って、それから花の話をやめた。"

    - who: sui
      face: normal
      text: "「詳しいんですね」"

    - text: "褒められたはずなのに、会話が一段階うしろに下がった。"
    - text: "（この人の得意なものを、こちらの得意にしてしまった）"

- id: sui_date_extra
  bg: street_evening
  next: schedule_hub
  body:
    - params: { tolerance: 8 }

    - text: "翠の店の前を、閉店時間に合わせて通る日が増えた。"

    - who: sui
      face: normal
      text: "「……来たんですね」"

    - who: iroha
      text: "「通りかかっただけ」"

    - who: sui
      face: smile
      text: "「毎週、通りかかるんですね」"

    - text: "バケツの水を捨てながら、翠が少しだけ笑った。"
    - text: "その日は、売れ残りの花の話をしなかった。"

# --- 橙香（橙／ユーモア）-----------------------------------------------------
# 軸: ツッコミの切れ味。正解は直前のボケの種類で変わる
# 地雷: 真面目に受け答えする、ボケを説明する、笑わない

- id: touka_date_01
  bg: family_restaurant
  bgm: bgm_date
  next: schedule_hub
  body:
    - params: { humor: 6 }

    - text: "橙香は、店に入って三秒で店員に話しかけていた。"

    - who: touka
      face: laugh
      text: "「すみません、いちばん失敗の少ないメニューください」"

    - text: "（頼み方がある）"

    - who: touka
      face: laugh
      text: "「色葉さん、わたしね、外食で冒険したことがないんですよ」"

    - who: touka
      face: laugh
      text: "「人生では毎日冒険してるのに」"

    - who: iroha
      text: "「どういう冒険」"

    - who: touka
      face: laugh
      text: "「昨日、シャンプーとリンス逆に使いました」"

    - text: "（……ここだ）"
    - text: "（この子は、拾われるのを待っている）"

    - choice:
        - text: "それは冒険じゃなくて事故"
          params: { humor: 6 }
          affection: { touka: 3 }
          goto: touka_date_01_sharp
        - text: "順番が逆でも、そんなに変わらないらしいですよ"
          params: { humor: -2 }
          goto: touka_date_01_flat

- id: touka_date_01_sharp
  next: schedule_hub
  body:
    - who: touka
      face: laugh
      text: "「事故！！ たしかに事故！」"

    - text: "橙香は、テーブルを叩いて笑った。周りの客が二人こちらを見た。"

    - who: touka
      face: smile
      text: "「あー、たのしい」"

    - who: touka
      face: normal
      text: "「わたし、笑わない人と一緒にいると、自分が変な人みたいに思えてくるんです」"

    - text: "はじめて、テンションが少し下がった声を聞いた。"

    - who: touka
      face: laugh
      text: "「って、重い！ 今の忘れて！ はい次のボケ！」"

    - text: "（……忘れないでおこう）"

- id: touka_date_01_flat
  next: schedule_hub
  body:
    - who: touka
      face: normal
      text: "「……あ、そうなんですね」"

    - text: "会話が、平らになった。"

    - who: touka
      face: laugh
      text: "「じゃあ明日から逆にしよっと！」"

    - text: "橙香はすぐ持ち直した。持ち直せてしまうのが、少し苦しかった。"
